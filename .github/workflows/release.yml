name: Release

# Every push to main is checked by semantic-release. A feat or fix commit since the last tag
# tags the next beta (v0.1.0-beta.N) and redeploys the web app. Other commit types publish nothing.
# GitHub release pages are only made for finished milestones: a milestone whose issues are all closed is
# closed here, and desktop.yml creates the release page for the newest tag and attaches the installers.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # Nobody reviews the release itself, so a failing check must stop it.
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "tag=$(git tag --points-at HEAD --list 'v*' | head -1)" >> "$GITHUB_OUTPUT"

  # Tags pushed with GITHUB_TOKEN do not trigger other workflows, so call the Pages deploy directly.
  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  # GitHub never closes milestones by itself, and a close made with GITHUB_TOKEN would not start desktop.yml,
  # so close finished milestones here, after the tag exists, and build the apps directly.
  milestones:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      closed: ${{ steps.close.outputs.closed }}
    steps:
      - id: close
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # The Feedback milestone is rolling and stays open.
          done=$(gh api "repos/$REPO/milestones?state=open" --paginate \
            --jq '.[] | select(.open_issues == 0 and .closed_issues > 0 and .title != "Feedback") | "\(.number)\t\(.title)"')
          closed=""
          while IFS=$'\t' read -r number title; do
            [ -z "$number" ] && continue
            gh api -X PATCH "repos/$REPO/milestones/$number" -f state=closed >/dev/null
            echo "Closed milestone: $title"
            closed="${closed:+$closed, }$title"
          done <<< "$done"
          echo "closed=$closed" >> "$GITHUB_OUTPUT"

  desktop:
    needs: [release, milestones]
    if: needs.milestones.outputs.closed != ''
    uses: ./.github/workflows/desktop.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
