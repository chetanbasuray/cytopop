name: Desktop apps

# Builds desktop apps with Pake (Tauri) from the same web build and attaches them to a release.
# Installers and release pages ship once per finished milestone; betas in between are tags only. The Release workflow calls this when it
# closes a finished milestone; closing one by hand triggers it too. Run it by hand to build for a chosen tag.
on:
  milestone:
    types: [closed]
  workflow_call:
    inputs:
      tag:
        type: string
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the apps to (empty for the newest release)
        type: string
        required: false

permissions:
  contents: write

jobs:
  tag:
    # The Feedback milestone is rolling and should never close; skip it if it ever does.
    if: github.event_name != 'milestone' || github.event.milestone.title != 'Feedback'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        env:
          WANTED: ${{ inputs.tag }}
        run: |
          TAG="${WANTED:-$(git describe --tags --abbrev=0 --match 'v*' origin/main)}"
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "No tag $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building desktop apps for $TAG"
      - name: Create the release page
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && { echo "Release $TAG exists"; exit 0; }
          # Notes cover every change since the previous release page, i.e. the whole milestone.
          PREV=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          gh release create "$TAG" --verify-tag --prerelease --title "$TAG" --generate-notes ${PREV:+--notes-start-tag "$PREV"}

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --multi-arch
            icon: desktop/icons/icon.icns
          - os: windows-latest
            args: ""
            icon: desktop/icons/icon.ico
          - os: ubuntu-24.04
            args: --targets deb
            icon: desktop/icons/icon.png
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # tags, for the version in the footer
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev build-essential
      - name: macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Generate desktop icons from src/ui/icon.svg
        run: bun run icons
      - name: Package with Pake
        shell: bash
        run: |
          mkdir -p desktop/out
          VERSION=$(node -p "require('./package.json').version")
          [[ -n "$TAG" ]] && VERSION="${TAG#v}"
          # Windows installers only accept numeric x.y.z, so drop any "-beta.N" suffix.
          npx -y pake-cli@3.18.0 ./dist/index.html --use-local-file --name CytoPop \
            --identifier io.github.chetanbasuray.cytopop --width 1280 --height 860 \
            --app-version "${VERSION%%-*}" --icon "${{ matrix.icon }}" ${{ matrix.args }}
          find . -maxdepth 1 \( -name '*.dmg' -o -name '*.msi' -o -name '*.deb' \) -exec mv {} desktop/out/ \;
          ls -la desktop/out
      - uses: actions/upload-artifact@v7
        with:
          name: cytopop-${{ runner.os }}
          path: desktop/out/*
      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" desktop/out/* --clobber
